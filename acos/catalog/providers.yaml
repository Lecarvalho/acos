# ACOS provider catalog.
#
# One entry per provider the orchestrator may route a stage to.
# Everything under `price` is optional and rough. It only feeds the
# advisory estimate; it never gates execution. Edit freely.
#
# `invoke` describes how each adapter reaches the provider from the
# current harness. Values:
#   native   - the harness can run this provider directly (session or subagent)
#   <string> - a shell command template for the external adapter.
#              The stage prompt is passed on stdin. {{model}} and
#              {{effort}} are substituted. Exit code 0 = ran; the
#              stage check decides pass/fail separately.
#   null     - not reachable through that adapter
#
# Effort. Each model lists under `effort` the provider-agnostic levels it
# can be set to; `effort_map` turns a level into the provider's setting.
# A model with no `effort` list accepts only `inherit`: it runs at
# whatever its runner defaults to. `inherit` is also what a delegated
# stage gets when it names no effort. It sets nothing: no prompt line,
# no workflow option, and `{{effort}}` substitutes to an empty string.

acos: "0.1"

providers:

  anthropic:
    label: Anthropic (Claude)
    invoke:
      inline: native
      subagent: native
      workflow: native
      external: "claude -p --model {{model}}"
    effort_map:            # provider-agnostic effort -> provider setting
      low: low
      medium: medium
      high: high
      max: max
    models:
      claude-opus-5:
        tier: strong
        context: 1000000
        effort: [low, medium, high, max]
        price: { input_per_mtok: 5.00, output_per_mtok: 25.00, currency: USD }
      claude-sonnet-5:
        tier: balanced
        context: 1000000
        effort: [low, medium, high, max]
        price: { input_per_mtok: 2.00, output_per_mtok: 10.00, currency: USD }
      claude-haiku-4-5:
        tier: fast
        context: 200000
        # no effort list: inherit only
        price: { input_per_mtok: 1.00, output_per_mtok: 5.00, currency: USD }

  openai:
    label: OpenAI
    invoke:
      inline: null
      subagent: null
      workflow: null
      external: "codex exec --model {{model}}"
    effort_map:
      low: low
      medium: medium
      high: high
      max: high
    models:
      gpt-5:
        tier: strong
        effort: [low, medium, high, max]
        # price omitted on purpose; fill in if you want it in estimates
      gpt-5-mini:
        tier: fast
        effort: [low, medium, high, max]

  google:
    label: Google (Gemini)
    invoke:
      inline: null
      subagent: null
      workflow: null
      external: "gemini -m {{model}} -p -"
    # no effort_map and no model effort lists: inherit only
    models:
      gemini-2.5-pro:
        tier: strong
      gemini-2.5-flash:
        tier: fast

  ollama:
    label: Ollama (local)
    invoke:
      inline: null
      subagent: null
      workflow: null
      external: "ollama run {{model}}"
    # no effort_map and no model effort lists: inherit only
    models:
      qwen3-coder:
        tier: local
        price: { input_per_mtok: 0, output_per_mtok: 0, currency: USD }
