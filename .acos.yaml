# Project defaults for ACOS, derived by `/acos init` from this repository.
# Catalog files reference these with {{ project.* }}.

acos: "0.1"

provider: anthropic
models:
  fast: claude-haiku-4-5         # scripted work, cheap checks
  balanced: claude-sonnet-5      # explorers, fan-out implementers, evidence
  strong: claude-opus-5          # planning, review, escalation

# This repository is Markdown, YAML, a JSON schema and small Node scripts.
# Verify checks the capture script, estimation contract examples and schema.
verify: "node --check skills/acos/scripts/shot.mjs && node --test tests/estimation-contract.test.mjs && npx --yes ajv-cli@5 compile --spec=draft2020 -s schema/acos.schema.json"

# Captures a cropped screenshot for a part's try-it page; substituted into
# {{ project.shot }}. Here the script sits in the source tree rather than in
# an installed skill copy.
shot: "node skills/acos/scripts/shot.mjs"

gates:
  go: required                   # `auto` only here, never in a preset

# Startup load: what this session holds before it reads a file. Not yet
# measured with /context; estimated from what loads here (harness system
# prompt and built-in tools ~20k, the configured MCP servers ~12k, the
# skill list ~7k, no CLAUDE.md). Sizing subtracts orchestrator from
# limits.orchestrator_tokens, leaving 80k for the work. Re-run
# `/acos init` to replace this with a measurement.
startup:
  orchestrator: 40000
  subagent: 22000
  basis: "estimated 2026-09-18 from the loaded harness surface; no /context reading yet"

limits:
  files: 8                       # per context: an inline part, or one slice
  lines: 400
  orchestrator_tokens: 120000
  worker_context_tokens: 300000 # per worker; omit worker_tokens_total when no
                                # aggregate worker ceiling is wanted
  agents: 3
  stages: 5
