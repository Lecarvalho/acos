# Example ACOS run manifest, as planned and approved at GO.
# What actually ran is recorded next to it in log.yaml
# (stage records, drift, actual counts). See SPEC.md 2.8.

acos: "0.1"
id: 2026-09-16-auth-token-refresh
intent: >
  Add silent refresh of the auth token when a request returns 401,
  without changing the public client API.

part:
  plan: 2026-09-16-auth-hardening
  index: 1
  of: 3
  after: []
  assumes: "Clean tree at main; npm test passes."

scope:
  include: [src/auth/, tests/auth/]
  notes: "Keep the AuthClient constructor signature unchanged."

stages:
  - name: plan
    block: plan
    adapter: inline           # no model, no effort: the session's, and fixed
    outputs: [plan]

  - name: implement
    block: implement
    adapter: inline
    inputs: [plan]
    outputs: [diff]
    check:
      kind: command
      command: "npm test -- auth"
    on_fail: escalate         # the escalated retry runs as a subagent:
                              # a session cannot change its own model
    escalation:
      - { provider: anthropic, model: claude-opus-5, effort: high }
    max_iterations: 3

  - name: review
    block: review
    adapter: external
    provider: openai
    model: gpt-5
    effort: high
    inputs: [plan, diff]
    outputs: [review]
    check:
      kind: review
      criteria: "No public API change. 401 path covered by a test."
    on_fail: ask

loop:
  max_iterations: 3
  on_fail: retry

gates:
  go: required
  per_stage: false

limits:
  orchestrator_tokens: 100000
  worker_tokens: 300000
  agents: 3
  stages: 5

estimate:
  files: 3
  lines: 150
  startup_tokens: 40000       # already gone when the first stage starts
  orchestrator_tokens: 90000  # startup included: 40k + 50k of work
  worker_tokens: 200000
  agents: 1
  per_stage:
    - { name: plan,      tokens: 15000 }
    - { name: implement, tokens: 35000 }
    - { name: review,    tokens: 200000 }
  basis: "startup 40k from .acos.yaml, measured 2026-09-18; calibration.md Cost section; review at the 200k subagent floor"

outputs:
  run_dir: runs/2026-09-16-auth-token-refresh
  write_log: true
