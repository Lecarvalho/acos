# Example ACOS run manifest, as planned and approved at GO. Its
# orchestrator rewrites it when the strategy changes; how it moved and
# what actually ran are recorded next to it in log.yaml
# (stage records, drift, actual counts). See SPEC.md 2.7 and 2.8.

acos: "0.1"
id: 2026-09-16-auth-token-refresh
intent: >
  Add silent refresh of the auth token when a request returns 401,
  without changing the public client API.

part:
  plan: 2026-09-16-auth-hardening
  index: 1
  of: 3
  after: []
  assumes: "Clean tree at main; npm test passes."

scope:
  include: [src/auth/, tests/auth/]
  notes: "Keep the AuthClient constructor signature unchanged."

stages:
  - name: plan
    block: plan
    adapter: inline           # no model, no effort: the session's, and fixed
    outputs: [plan]

  - name: implement
    block: implement
    adapter: inline
    inputs: [plan]
    outputs: [diff]
    check:
      kind: command
      command: "npm test -- auth"
    on_fail: escalate         # the escalated retry runs as a subagent:
                              # a session cannot change its own model
    escalation:
      - { provider: anthropic, tier: strong, model: claude-opus-5-5, effort: high }
    max_iterations: 3

  - name: review
    block: review
    adapter: external
    provider: openai
    tier: strong
    model: gpt-6-astra
    effort: high
    inputs: [plan, diff]
    outputs: [review]
    check:
      kind: review
      criteria: "No public API change. 401 path covered by a test."
    on_fail: retry

loop:
  max_iterations: 3
  on_fail: retry

gates:
  go: required
  per_stage: false

limits:
  orchestrator_tokens: 120000
  worker_context_tokens: 200000

estimate:
  files: 3
  lines: 150
  calibration: project
  confidence: medium
  orchestrator:
    startup_tokens: 40000
    work_tokens: 50000
    coordination_tokens: 10000
    reserved_tokens: 100000
    limit_tokens: 120000
  workers:
    - stage: review
      work_class: review
      startup_included: true
      reserved_tokens: 200000
      limit_tokens: 200000
  aggregate_reserved_tokens: 300000 # volume across two contexts, not a fit limit
  observed_tokens: null              # remains unknown until execution measures it
  agents: 1
  per_stage:
    - { name: plan,      work_class: semantic, reserved_tokens: 15000 }
    - { name: implement, work_class: semantic, reserved_tokens: 35000 }
    - { name: review,    work_class: review, reserved_tokens: 200000 }
  basis: "startup 40k from config.yaml, measured 2026-09-18; project calibration for inline work; review at its 200k reservation"

outputs:
  run_dir: runs/2026-09-16-auth-token-refresh
  write_log: true
